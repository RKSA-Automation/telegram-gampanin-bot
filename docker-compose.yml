version: "3.9"

services:
  suguan-bot:
    build: .
    container_name: suguan-bot
    restart: unless-stopped
    command: python -u bot.py
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
#    dns:
#      - 8.8.8.8
#      - 1.1.1.1
    networks:
      - suguan-net

  db:
    image: mysql:8.0
    container_name: suguan-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - suguan-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASS}"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: suguan-adminer
    restart: unless-stopped
    ports:
      - 8080:8080
    networks:
      - suguan-net

  task-gui:
    build:
      context: ./task-gui
    container_name: suguan-task-gui
    restart: unless-stopped
    ports:
      - 5000:5000
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
    depends_on:
      - db
    networks:
      - suguan-net


volumes:
  mysql_data:

networks:
  suguan-net:
    driver: bridge
